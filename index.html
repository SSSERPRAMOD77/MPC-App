 <!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 20px; }
    .container { max-width: 500px; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin: auto; }
    h2 { color: #2c3e50; text-align: center; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
    input[readonly] { background: #eee; }
    button { width: 100%; padding: 12px; background: #27ae60; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; margin-top: 10px; }
    button:hover { background: #219150; }
    .popup { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 25px; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.3); z-index: 100; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <h2>MPC Record Entry</h2>
    <div class="form-group">
      <label>MPC Number</label>
      <select id="mpcNo" onchange="fetchCode()">
        <option value="">Select MPC Number</option>
        <option value="101">101</option> <!-- Add your numbers here -->
        <option value="102">102</option>
      </select>
    </div>
    <div class="form-group">
      <label>MPC Code (Auto)</label>
      <input type="text" id="mpcCode" readonly>
    </div>
    <div id="otherDetails">
      <input type="text" id="issuedTo" placeholder="Leader Name" class="form-group">
      <input type="text" id="upline" placeholder="Upline Name" class="form-group">
      <input type="text" id="guest" placeholder="Guest Name" class="form-group">
      <input type="number" id="saleBv" placeholder="Sale (BV)" class="form-group">
      <input type="date" id="doj" class="form-group">
      <input type="text" id="aadhar" placeholder="Aadhar Number" class="form-group">
      <input type="text" id="pan" placeholder="PAN Number" class="form-group">
      <button onclick="submitData()">Submit Record</button>
    </div>
  </div>

  <div id="msgPopup" class="popup">
    <h3 id="popTitle"></h3>
    <p id="popText"></p>
    <button onclick="closePopup()">OK</button>
  </div>

  <script>
    function fetchCode() {
      var mpcNo = document.getElementById('mpcNo').value;
      google.script.run.withSuccessHandler(function(code) {
        document.getElementById('mpcCode').value = code;
      }).getMpcCode(mpcNo);
    }

    function submitData() {
      var data = {
        mpcNo: document.getElementById('mpcNo').value,
        mpcCode: document.getElementById('mpcCode').value,
        issuedTo: document.getElementById('issuedTo').value,
        upline: document.getElementById('upline').value,
        guest: document.getElementById('guest').value,
        saleBv: document.getElementById('saleBv').value,
        doj: document.getElementById('doj').value,
        aadhar: document.getElementById('aadhar').value,
        pan: document.getElementById('pan').value
      };

      google.script.run.withSuccessHandler(function(res) {
        if (res.status === "exists") {
          showPopup("Already Saved", "This MPC is already linked to " + res.guest);
        } else {
          showPopup("Congratulations!", "Record saved! MPC Code: " + res.code);
        }
      }).submitRecord(data);
    }

    function showPopup(title, text) {
      document.getElementById('popTitle').innerText = title;
      document.getElementById('popText').innerText = text;
      document.getElementById('msgPopup').style.display = 'block';
    }

    function closePopup() {
      document.getElementById('msgPopup').style.display = 'none';
      location.reload();
    }
  </script>
</body>
</html>
